syntax = "proto3";
package api;

import "analytics.proto";

option go_package = "kudzutechnologies/analytics/api";

service AnalyticsServer {
  // Logs in to the remote service
  rpc Hello(ReqHello) returns (RespHello);
  rpc Login(ReqLogin) returns (RespLogin);
  // Pushes analytics data to the server
  rpc PushMetrics(AnalyticsMetrics) returns (RespPush);
  // Creates or updates a gateway record
  rpc GatewayUpsert(ReqGatewayUpsert) returns (RespGatewaySync);
  // Deletes a gateway record controlled by this integration
  rpc GatewayDelete(ReqGatewayDelete) returns (RespGatewaySync);
}

//////////////////////////////////////////////////////////////////////
// Handshake
//////////////////////////////////////////////////////////////////////

// Sends the current client version
message ReqHello { int32 version = 1; }

// Receives the server version & a challenge code
message RespHello {
  int32 revision = 1;
  bytes challenge = 2;
}

//////////////////////////////////////////////////////////////////////
// Identification
//////////////////////////////////////////////////////////////////////

// Identifies using the given client ID and a hash computed
// using the challenge received from the handshake and the
// well-known client key
message ReqLogin {
  bytes clientId = 1;
  bytes hash = 2;
  bool serverSide = 3;
}

// Receives the access token that can be used for pushing metrics
message RespLogin { string accessToken = 2; }

//////////////////////////////////////////////////////////////////////
// Analytics Endpoints
//////////////////////////////////////////////////////////////////////

// Pushes metrics to the analytics endpoint
message RespPush {}

//////////////////////////////////////////////////////////////////////
// Gateway Synchronization
//////////////////////////////////////////////////////////////////////

// Geographic location for a gateway (WGS84).
message GatewayLocation {
  double latitude = 1;
  double longitude = 2;
  // Optional altitude in metres above sea level.
  optional double altitude = 3;
}

// Radio/antenna configuration for a gateway.
// Maps to Kudzu engine-types GatewayRadio.
message GatewayRadio {
  int32 rf_chain = 1;
  float max_tx_power = 2;
  optional float gain_sensitivity = 3;
  optional float gain_antenna = 4;
  optional float loss_cable = 5;
  // Frequency plan ObjectID hex string (optional; server may default).
  optional string freq_plan = 6;
}

// Wrapper so omitted tags preserves existing values; present empty clears.
message GatewayTags {
  repeated string values = 1;
}

// Wrapper so omitted radios preserves existing values; present empty clears.
message GatewayRadios {
  repeated GatewayRadio values = 1;
}

// Creates a gateway if missing, or updates parameters if it exists.
// Caller must provide at least gateway_eui or external_id.
// Optional gateway_id is the authoritative Kudzu ObjectID selector.
message ReqGatewayUpsert {
  // Optional Kudzu gateway ObjectID hex (authoritative selector when set).
  optional string gateway_id = 1;
  // LoRaWAN gateway EUI (8 bytes).
  optional bytes gateway_eui = 2;
  // External identifier (takes precedence over EUI for lookup).
  optional string external_id = 3;
  // Optional display name.
  optional string name = 4;
  // Optional geographic location.
  optional GatewayLocation location = 5;
  // Optional free-form notes.
  optional string notes = 6;
  // Optional radio configurations (presence = replace; empty = clear).
  optional GatewayRadios radios = 7;
  // Optional gateway status (0=planning, 1=live, 2=decommissioned).
  optional int32 status = 8;
  // Optional tags (presence = replace; empty = clear).
  optional GatewayTags tags = 9;
}

// Deletes an existing gateway controlled by the ingress_api integration.
// Caller must provide at least gateway_eui or external_id.
message ReqGatewayDelete {
  // Optional Kudzu gateway ObjectID hex (authoritative selector when set).
  optional string gateway_id = 1;
  // LoRaWAN gateway EUI (8 bytes).
  optional bytes gateway_eui = 2;
  // External identifier (takes precedence over EUI for lookup).
  optional string external_id = 3;
}

// Acknowledgement for GatewayUpsert / GatewayDelete.
// Policy ignores (identity mismatch, autosync off, missing target with
// gateway_id) return success with applied=false.
message RespGatewaySync {
  // Resolved Kudzu gateway ObjectID hex, when known.
  string gateway_id = 1;
  // True when a create/update/delete mutation was applied.
  bool applied = 2;
}
